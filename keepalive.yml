name: Keep Alive

# 공개(Public) 저장소는 60일간 활동이 없으면 예약 실행(schedule)이 자동 중지됩니다.
# 매월 1일 활동 기록(빈 커밋)을 남기고 신호 워크플로를 다시 활성화해 중지를 막습니다.
# (비공개 저장소는 이 규칙 대상이 아니지만, 넣어둬도 해롭지 않습니다.)

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 활동 기록용 빈 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive $(date -u +%Y-%m-%d)"
          git push

      - name: 신호 워크플로 재활성화
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "Ballast Daily Signal" --repo "${{ github.repository }}"
